
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BLE_TEST_Ver_1.0</title>
  </head>
  <body>
    <div class="container"> 
      <h1> WEB BLE v1.0</h1> 
      <p>接続デバイス名</p>
      <input id="devicename" value="未接続" />
      <br>
      <button id="connect-button">接続</button>
      <button id="disconnect-button">切断</button>
      <p>LED_R</p>
      <button id="led1_send_hi">HI</button>  <button id="led1_send_mid">MID</button>  <button id="led1_send_off">OFF</button>
      <p>LED_G</p>
      <button id="led2_send_hi">HI</button>  <button id="led2_send_mid">MID</button>  <button id="led2_send_off">OFF</button>
      <p>LED_B</p>
      <button id="led3_send_hi">HI</button>  <button id="led3_send_mid">MID</button>  <button id="led3_send_off">OFF</button>
      <p>AD値受信</p>
      <input id="val_adc" value="" />
      <button id="adc_get">受信</button>
      <p>SW状態</p>
      <input id="val_sw" value="" />
      <button id="sw_get">受信</button>  
    </div>
    <script src="d3/d3.js"></script>    
    <script src="webble.js"></script> 
  </body>
</html>
